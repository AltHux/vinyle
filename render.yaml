# Render: New > Blueprint, wskaż to repozytorium
services:
  - type: web
    name: vinyle
    runtime: docker
    plan: starter
    region: frankfurt
    envVars:
      - key: VINYLE_DB
        value: /data/vinyle.db
      - key: HOSTNAME
        value: 0.0.0.0
    disk:
      name: vinyle-data
      mountPath: /data
      sizeGB: 1
