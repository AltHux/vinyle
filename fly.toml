# Fly.io: fly launch --copy-config --no-deploy && fly volumes create vinyle_data --size 1 && fly deploy
app = "vinyle"
primary_region = "waw"

[build]

[env]
  VINYLE_DB = "/data/vinyle.db"

[mounts]
  source = "vinyle_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
